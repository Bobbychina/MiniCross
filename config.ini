; ============================================================
;  MiniCross 外置准星配置文件 (UTF-8)
;  改完直接保存即热重载，也可按 F9 手动重载
;  颜色支持 #RGB / #RRGGBB / #AARRGGBB / 颜色名(red, lime, cyan...)
;  ';' '# ' 前面带空白才算注释
; ============================================================

[general]
profile           = default        ; 当前方案，对应下面的 [profile:名字]
profiles          = default,dot_only,awp,sniper   ; 留空=按文件顺序自动发现所有 [profile:*]
monitor           = 0              ; 0=主屏 1=第二屏 ...
x_percent         = 50             ; 横向位置（该屏宽度的百分比，可带小数）
y_percent         = 50             ; 纵向位置
offset_x          = 0              ; 在百分比定位上的像素微调
offset_y          = 0
scale             = 1.0            ; 整体缩放（长度/粗细/间距一起放大）
rotation          = 0              ; 整体旋转角度
nudge_step        = 1              ; Ctrl+Alt+方向键 每次挪动像素
hide_from_capture = 0              ; 1 = 录屏/截图/OBS 里不显示准星
antialias         = 1             ; 抗锯齿
auto_reload       = 1              ; 保存本文件自动生效
keep_on_top       = 1              ; 周期性重新置顶（对抗全屏游戏抢 z 序）
topmost_check_ms  = 1500           ; 置顶检查间隔
web_enabled       = auto           ; auto=要用时才起（平时不占内存）/ 1=常开 / 0=关闭
web_port          = 7777           ; 端口；被占用会自动往后找 20 个
trim_memory       = 1              ; 空闲时压缩工作集（常驻内存可降到个位数 MB）
trim_delay_ms     = 20000          ; 空闲多久后压缩

; ---------------- 主十字 ----------------
[cross]
enabled       = 1
length        = 10     ; 每条臂的长度
thickness     = 2      ; 线宽
gap           = 4      ; 中心留空半径
arms          = 1111   ; 上,下,左,右 四臂开关；0001=只有右臂 1101=T形 也可写 up,down
color         = #00FF00
alpha         = 255    ; 0~255 透明度
outline       = 1      ; 描边宽度，0=关闭
outline_color = #000000
outline_alpha = 200

; ---------------- 斜十字 X ----------------
[diagonal]
enabled       = 0
length        = 8
thickness     = 1
gap           = 4
angle         = 45
arms          = 1111
color         = #00FF00
alpha         = 160
outline       = 0
outline_color = #000000
outline_alpha = 200

; ---------------- 中心点 ----------------
[dot]
enabled       = 1
size          = 3      ; 直径
color         = #00FF00
alpha         = 255
outline       = 0
outline_color = #000000
outline_alpha = 255

; ---------------- 圆环 ----------------
[circle]
enabled       = 0
radius        = 18
thickness     = 1
color         = #00FF00
alpha         = 150
outline       = 0
outline_color = #000000
outline_alpha = 200

; ---------------- 四角括号 ----------------
[bracket]
enabled       = 0
size          = 16     ; 角点到中心的距离
length        = 6      ; 每个角两条短臂的长度
thickness     = 2
color         = #00FF00
alpha         = 200
outline       = 1
outline_color = #000000
outline_alpha = 200

; ---------------- 自定义图片 ----------------
[image]
enabled       = 0
path          = crosshair.png   ; 相对本文件目录，或绝对路径；支持透明 PNG
size          = 64
angle         = 0
alpha         = 255
outline       = 0      ; 图片不支持描边
outline_color = #000000
outline_alpha = 200

; ---------------- 热键 ----------------
[hotkeys]
toggle       = F8               ; 显示/隐藏
open_ui      = Ctrl+Alt+E       ; 打开网页配置台
reload       = F9               ; 重载配置
next_profile = F10              ; 切换到下一个方案
quit         = Ctrl+Alt+Q       ; 退出
nudge_up     = Ctrl+Alt+Up      ; 挪准星（仅本次运行有效，不会写回文件）
nudge_down   = Ctrl+Alt+Down
nudge_left   = Ctrl+Alt+Left
nudge_right  = Ctrl+Alt+Right

; ============================================================
;  配置方案：写 section.key = 值，只列要覆盖的项
;  按 F10 循环切换
; ============================================================

[profile:default]
general.scale = 1.0
dot.size = 3
dot.outline_alpha = 0

[profile:dot_only]
cross.enabled = 0
circle.enabled = 0
dot.enabled   = 1
dot.size      = 4

[profile:awp]
cross.enabled  = 1
cross.length   = 6
cross.thickness= 2
cross.gap      = 9
dot.enabled    = 1
dot.size       = 2
circle.enabled = 1
circle.radius  = 15
circle.thickness = 1
circle.alpha   = 120

[profile:sniper]
cross.enabled   = 0
dot.enabled     = 0
bracket.enabled = 1
bracket.size    = 22
bracket.length  = 10
bracket.thickness = 2
